# Optional mat user config.
#
# DEPRECATED: git config is now the canonical store for these settings. Prefer:
#
#   git config --global mat.username "your name"
#   git config --global mat.defaultBackend claude
#
# git config resolves system -> global -> local, so a per-repo override works
# without any extra mat handling. Already have a user.conf? Migrate it with:
#
#   mat config migrate          # dry-run, shows what would be written
#   mat config migrate --confirm
#
# This file is still read as a lower-priority fallback this release (git config
# wins per key); a follow-up release removes user.conf loading entirely.
#
# Copy to ~/.config/mat/user.conf and edit to taste.

export MAT_USER_NAME="your name"
export MAT_DEFAULT_BACKEND="claude"

# Note: MAT_NOTIFY is NOT read from this file. To suppress the session-start
# Telegram notification, export MAT_NOTIFY=0 in the shell that invokes mat
# (e.g. .bashrc/.zshrc), or inline for a single launch.
