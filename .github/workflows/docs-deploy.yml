name: Docs site

# Verify the complete public projection from this repository and deploy only
# after a trusted main push has passed the same verification.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history + tags keep the stable release tag reachable from HEAD for
      # the version badge in both pull-request and main verification.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        working-directory: docs-site
        run: pnpm audit --audit-level=high
      - name: Unit tests (sync + leak guard contracts)
        working-directory: docs-site
        run: pnpm test
      - name: Build site (sync + Astro build + leak guard)
        working-directory: docs-site
        run: pnpm run build
      - name: Leak guard self-test
        working-directory: docs-site
        run: pnpm run leak-guard:self-test
      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist-${{ github.sha }}
          path: docs-site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    # A fork pull request never creates this job, so its untrusted code cannot
    # receive either Cloudflare secret.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      # A missing Cloudflare secret on a main push is a credential regression,
      # not an unprovisioned repository. Fail loudly rather than skipping the
      # deploy step, so a successful `deploy` job always means the site was
      # actually published and the private projection lane can trust that
      # signal.
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo 'CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required to deploy mat-docs.' >&2
            echo 'Provision both repository secrets, then re-run this workflow.' >&2
            exit 1
          fi
      # `wrangler` is a docs-site devDependency pinned in its package.json, and
      # wrangler-action resolves the package manager from that manifest
      # (`pnpm@11.11.0`). This job therefore needs the same Node + pnpm
      # toolchain and frozen install as `verify`; without them the action fails
      # with `Unable to locate executable file: pnpm`.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: docs-site-dist-${{ github.sha }}
          path: docs-site/dist
      # wranglerVersion matches the `wrangler` pin in docs-site/package.json so
      # the action uses the frozen install instead of mutating the manifest at
      # deploy time; docs-site/README.md requires the two to stay in sync.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          wranglerVersion: '4.129.0'
          command: pages deploy dist --project-name=mat-docs --branch=main
