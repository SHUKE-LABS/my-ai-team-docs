name: Docs site

# Verify the complete public projection from this repository and deploy only
# after a trusted main push has passed the same verification.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history + tags keep the stable release tag reachable from HEAD for
      # the version badge in both pull-request and main verification.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json
      - name: Install dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        working-directory: docs-site
        run: pnpm audit --audit-level=high
      - name: Unit tests (sync + leak guard contracts)
        working-directory: docs-site
        run: pnpm test
      - name: Build site (sync + Astro build + leak guard)
        working-directory: docs-site
        run: pnpm run build
      - name: Leak guard self-test
        working-directory: docs-site
        run: pnpm run leak-guard:self-test
      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist-${{ github.sha }}
          path: docs-site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    # A fork pull request never creates this job, so its untrusted code cannot
    # receive either Cloudflare secret. The step-level gate skips cleanly when
    # the repository has not been provisioned yet.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: docs-site-dist-${{ github.sha }}
          path: docs-site/dist
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          command: pages deploy dist --project-name=mat-docs --branch=main
