# pnpm build-script approval (pnpm 11 reads this file even outside a workspace).
# esbuild's postinstall validates its platform binary; the frozen lockfile pins the tarball it comes from.
allowBuilds:
  esbuild: true
  # These packages do not need lifecycle scripts; keep them explicitly denied.
  sharp: false
  # workerd's postinstall selects the platform binary; the frozen lockfile pins the tarball.
  workerd: true
  wrangler: false

# GHSA-rgj7-g3m4-5g8c / GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545: libheif
# vulnerabilities in sharp < 0.35.4. The direct dependency is already patched;
# wrangler pulls an older copy transitively through miniflare, which fails
# `pnpm audit --audit-level=high` and therefore blocks the whole publication
# lane. The override lifts that transitive copy to the version the direct
# dependency already resolves.
#
# GHSA-mcm9-63f2-9j32 / GHSA-j22f-vq7h-c4qm / GHSA-x5rw-q4pp-hg5g (devalue) and
# the undici WebSocket/TLS/origin-isolation advisories: the lockfile resolved
# vulnerable `devalue@5.9.2`, `undici@7.29.0` and `undici@8.10.1` transitively
# and `pnpm audit --audit-level=high` failed, blocking the publication lane.
# astro's `^5.8.1` and unifont's `^8.0.0` ranges already allow the patched
# floors, but miniflare pins `undici: 7.29.0` exactly, so the 7.x copy can only
# be lifted by an override. Pin each override to the patched floor so the
# resolution stays as close to the vulnerable graph as the fix allows, and keep
# it scoped to its major line so the 7.x and 8.x consumers stay on their own API.
overrides:
  sharp: ^0.35.4
  devalue: 5.9.3
  "undici@>=7 <8": 7.29.1
  "undici@>=8 <9": 8.10.2
